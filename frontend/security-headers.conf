add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Content-Security-Policy — single source of truth for every environment that runs nginx.
#
# Third-party origins and why each is here:
#   www.google.com / www.gstatic.com  reCAPTCHA (script, img, frame)
#   fonts.googleapis.com              Google Fonts stylesheet (see index.html)
#   fonts.gstatic.com                 Google Fonts woff2 files
#   www.googletagmanager.com          gtag.js, injected at runtime by firebase/analytics
#                                     getAnalytics(). Nothing in src/ references it, so it
#                                     is invisible to grep — do not remove while the
#                                     FIREBASE block exists in config.js.
#   *.google-analytics.com            GA4 beacons. connect-src covers the normal
#                                     fetch/sendBeacon path; img-src covers the pixel
#                                     fallback used when those are unavailable.
#
# connect-src stays broad (`https:`) on purpose: API_BASE_URL is runtime-configurable via
# /config.js, so this static policy cannot know the API origin at build time. Narrowing it
# would break every deployment that points at a different backend.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https:; frame-src https://www.google.com; object-src 'none'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
